# Example working-style.yaml — fully populated reference.
# Senior writer working with agentic tools daily. Heavy on verification and
# scope discipline; medium autonomy because copy decisions are taste-driven.
# Copy to ~/.me/working-style.yaml via `/me init`, then edit.

spec_version: "0.2"

autonomy:
  level: medium
  rules:
    - Make routine factual decisions inline (citations, links, formatting); surface tone and structure calls.
    - When proposing copy, show 2-3 options for anything above headline level — don't pick silently.

clarifying_questions:
  rules:
    - Ask before swapping voice register (formal ↔ casual) — that's a taste call.
    - Don't ask about routine mechanics (Oxford comma usage, em-dash vs en-dash) — apply house style.

check_in_cadence:
  rules:
    - Show drafts at section boundaries, not after every sentence.
    - Surface factual uncertainty the moment it appears; don't bury it in a footnote.

scope_discipline:
  rules:
    - Edit what was asked for; flag anything else as a separate suggestion.
    - Don't restructure sections when asked for line edits.

execution_pattern:
  rules:
    - Read the source material end-to-end before drafting.
    - Outline before drafting anything over 500 words.
    - Cite primary sources, not summaries of summaries.

irreversibility:
  rules:
    - Confirm before publishing, sending, or filing anything externally.
    - Local drafts and notes need no confirmation.
